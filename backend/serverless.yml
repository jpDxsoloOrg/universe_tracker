service: universe-tracker-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: ${env:SLS_RUNTIME, 'nodejs20.x'}
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    SERVICE_NAME: ${self:service}
    STAGE: ${self:provider.stage}
    WRESTLERS_TABLE: ${self:service}-wrestlers-${self:provider.stage}
    MATCHES_TABLE: ${self:service}-matches-${self:provider.stage}
    CHAMPIONSHIPS_TABLE: ${self:service}-championships-${self:provider.stage}
    CHAMPIONSHIP_HISTORY_TABLE: ${self:service}-championship-history-${self:provider.stage}
    TOURNAMENTS_TABLE: ${self:service}-tournaments-${self:provider.stage}
    SEASONS_TABLE: ${self:service}-seasons-${self:provider.stage}
    SEASON_STANDINGS_TABLE: ${self:service}-season-standings-${self:provider.stage}
    DIVISIONS_TABLE: ${self:service}-divisions-${self:provider.stage}
    EVENTS_TABLE: ${self:service}-events-${self:provider.stage}
    CONTENDER_RANKINGS_TABLE: ${self:service}-contender-rankings-${self:provider.stage}
    RANKING_HISTORY_TABLE: ${self:service}-ranking-history-${self:provider.stage}
    IMAGES_BUCKET: ${self:service}-images-${self:provider.stage}
    SITE_CONFIG_TABLE: ${self:service}-site-config-${self:provider.stage}
    STIPULATIONS_TABLE: ${self:service}-stipulations-${self:provider.stage}
    MATCH_TYPES_TABLE: ${self:service}-match-types-${self:provider.stage}
    SEASON_AWARDS_TABLE: ${self:service}-season-awards-${self:provider.stage}
    COMPANIES_TABLE: ${self:service}-companies-${self:provider.stage}
    SHOWS_TABLE: ${self:service}-shows-${self:provider.stage}
    DRAFTS_TABLE: ${self:service}-drafts-${self:provider.stage}
    DYNAMODB_ENDPOINT: ${env:DYNAMODB_ENDPOINT, 'http://localhost:8000'}
    COGNITO_USER_POOL_ID: 'us-east-1_5GZ9UY8V2'
    COGNITO_CLIENT_ID: '5bn99khg7knh9v0t5dqbjpgh1d'
    ADMIN_SETUP_KEY: ${env:ADMIN_SETUP_KEY, 'default-dev-key-change-in-production'}
    ALLOWED_ORIGIN: ${self:custom.allowedOrigin.${self:provider.stage}, 'https://universe.jpdxsolo.com'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.WRESTLERS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.WRESTLERS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.MATCHES_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.MATCHES_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CHAMPIONSHIPS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CHAMPIONSHIP_HISTORY_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.TOURNAMENTS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SEASONS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SEASON_STANDINGS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SEASON_STANDINGS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DIVISIONS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.EVENTS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.EVENTS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CONTENDER_RANKINGS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.CONTENDER_RANKINGS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.RANKING_HISTORY_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.RANKING_HISTORY_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SITE_CONFIG_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.STIPULATIONS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.MATCH_TYPES_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SEASON_AWARDS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.COMPANIES_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SHOWS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.SHOWS_TABLE}/index/*
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DRAFTS_TABLE}
            - arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DRAFTS_TABLE}/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${self:provider.environment.IMAGES_BUCKET}/*
        - Effect: Allow
          Action:
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminAddUserToGroup
            - cognito-idp:AdminRemoveUserFromGroup
            - cognito-idp:AdminListGroupsForUser
            - cognito-idp:AdminDisableUser
            - cognito-idp:AdminEnableUser
            - cognito-idp:ListUsers
            - cognito-idp:ListUsersInGroup
          Resource:
            - arn:aws:cognito-idp:us-east-1:435238036810:userpool/us-east-1_5GZ9UY8V2

plugins:
  - serverless-plugin-typescript
  - serverless-plugin-split-stacks
  - serverless-offline

custom:
  splitStacksEnabled:
    dev: true
    offline: false
  splitStacks:
    perFunction: false
    perType: ${self:custom.splitStacksEnabled.${self:provider.stage}, true}
    perGroupFunction: false
  serverless-offline:
    httpPort: 3001
    environment:
      IS_OFFLINE: 'true'
  allowedOrigin:
    dev: https://universe.jpdxsolo.com
    offline: '*'
  corsConfig: &corsConfig
    origin: ${self:custom.allowedOrigin.${self:provider.stage}, 'https://universe.jpdxsolo.com'}
    headers:
      - Content-Type
      - X-Amz-Date
      - Authorization
      - X-Api-Key
      - X-Amz-Security-Token
      - X-Amz-User-Agent
    allowCredentials: true
  frontendBucket:
    dev: universe.jpdxsolo.com
    offline: 'localhost'
  frontendDomain:
    dev: universe.jpdxsolo.com
    offline: 'localhost'
  certificateArn:
    dev: ${env:ACM_CERTIFICATE_ARN, ''}
    offline: ''

functions:
  # Auth
  adminAuthorizer:
    handler: functions/auth/authorizer.handler

  createAdminUser:
    handler: functions/auth/createAdminUser.handler
    events:
      - http:
          path: auth/setup
          method: post
          cors: *corsConfig

  login:
    handler: functions/auth/login.handler
    events:
      - http:
          path: auth/login
          method: post
          cors: *corsConfig

  # Site Configuration + Admin tools (Phase 3 consolidated: getSiteConfig, updateSiteConfig, clearAll, seedData)
  admin:
    handler: functions/admin/handler.handler
    timeout: 29
    events:
      - http:
          path: site-config
          method: get
          cors: *corsConfig
      - http:
          path: admin/site-config
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: admin/clear-all
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: admin/seed-data
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: admin/export-data
          method: get
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Wrestlers (Phase 2 consolidated: getWrestlers, createWrestler, updateWrestler, deleteWrestler, importWrestlers)
  wrestlers:
    handler: functions/wrestlers/handler.handler
    timeout: 30
    events:
      - http:
          path: wrestlers
          method: get
          cors: *corsConfig
      - http:
          path: wrestlers/import
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: wrestlers
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: wrestlers/{wrestlerId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: wrestlers/{wrestlerId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: wrestlers/{wrestlerId}/statistics
          method: get
          cors: *corsConfig

  # Matches (Phase 3 consolidated: getMatches, scheduleMatch, recordResult)
  matches:
    handler: functions/matches/handler.handler
    events:
      - http:
          path: matches
          method: get
          cors: *corsConfig
      - http:
          path: matches
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: matches/{matchId}/result
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Championships (Phase 2 consolidated: getChampionships, createChampionship, getChampionshipHistory, updateChampionship, deleteChampionship, vacateChampionship)
  championships:
    handler: functions/championships/handler.handler
    events:
      - http:
          path: championships
          method: get
          cors: *corsConfig
      - http:
          path: championships
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: championships/{championshipId}/history
          method: get
          cors: *corsConfig
      - http:
          path: championships/{championshipId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: championships/{championshipId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: championships/{championshipId}/vacate
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Tournaments (Phase 3 consolidated: getTournaments, createTournament, updateTournament)
  tournaments:
    handler: functions/tournaments/handler.handler
    events:
      - http:
          path: tournaments
          method: get
          cors: *corsConfig
      - http:
          path: tournaments
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: tournaments/{tournamentId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Dashboard (aggregated league overview)
  getDashboard:
    handler: functions/dashboard/getDashboard.handler
    events:
      - http:
          path: dashboard
          method: get
          cors: *corsConfig

  # Standings
  getStandings:
    handler: functions/standings/getStandings.handler
    events:
      - http:
          path: standings
          method: get
          cors: *corsConfig

  # Activity feed (news feed / activity timeline)
  activity:
    handler: functions/activity/handler.handler
    events:
      - http:
          path: activity
          method: get
          cors: *corsConfig

  # Seasons (Phase 1 consolidated: getSeasons, createSeason, updateSeason, deleteSeason)
  seasons:
    handler: functions/seasons/handler.handler
    events:
      - http:
          path: seasons
          method: get
          cors: *corsConfig
      - http:
          path: seasons
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: seasons/{seasonId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: seasons/{seasonId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Season Awards (GET, POST, DELETE for season awards)
  seasonAwards:
    handler: functions/seasonAwards/handler.handler
    events:
      - http:
          path: seasons/{seasonId}/awards
          method: get
          cors: *corsConfig
      - http:
          path: seasons/{seasonId}/awards
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: seasons/{seasonId}/awards/{awardId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Divisions (Phase 1 consolidated: getDivisions, createDivision, updateDivision, deleteDivision)
  divisions:
    handler: functions/divisions/handler.handler
    events:
      - http:
          path: divisions
          method: get
          cors: *corsConfig
      - http:
          path: divisions
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: divisions/{divisionId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: divisions/{divisionId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Stipulations (Phase 1 consolidated: getStipulations, createStipulation, updateStipulation, deleteStipulation)
  stipulations:
    handler: functions/stipulations/handler.handler
    events:
      - http:
          path: stipulations
          method: get
          cors: *corsConfig
      - http:
          path: stipulations
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: stipulations/{stipulationId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: stipulations/{stipulationId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Match Types (Phase 1 consolidated: getMatchTypes, createMatchType, updateMatchType, deleteMatchType)
  matchTypes:
    handler: functions/matchTypes/handler.handler
    events:
      - http:
          path: match-types
          method: get
          cors: *corsConfig
      - http:
          path: match-types
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: match-types/{matchTypeId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: match-types/{matchTypeId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Events (Phase 2 consolidated: getEvents, getEvent, createEvent, updateEvent, deleteEvent)
  events:
    handler: functions/events/handler.handler
    events:
      - http:
          path: events
          method: get
          cors: *corsConfig
      - http:
          path: events/{eventId}
          method: get
          cors: *corsConfig
      - http:
          path: events
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: events/{eventId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: events/{eventId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Companies (CRUD for wrestling companies/promotions)
  companies:
    handler: functions/companies/handler.handler
    events:
      - http:
          path: companies
          method: any
          cors: *corsConfig
      - http:
          path: companies/{companyId}
          method: any
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Shows (CRUD for TV shows/programs)
  shows:
    handler: functions/shows/handler.handler
    events:
      - http:
          path: shows
          method: any
          cors: *corsConfig
      - http:
          path: shows/{showId}
          method: any
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Drafts (CRUD + draft actions: start, pick, protect, complete)
  drafts:
    handler: functions/drafts/handler.handler
    timeout: 30
    events:
      - http:
          path: drafts
          method: get
          cors: *corsConfig
      - http:
          path: drafts
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: drafts/{draftId}
          method: get
          cors: *corsConfig
      - http:
          path: drafts/{draftId}
          method: put
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: drafts/{draftId}
          method: delete
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: drafts/{draftId}/start
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: drafts/{draftId}/pick
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: drafts/{draftId}/protect
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer
      - http:
          path: drafts/{draftId}/complete
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Contenders (Phase 3 consolidated: getContenders, calculateRankings)
  contenders:
    handler: functions/contenders/handler.handler
    timeout: 29
    events:
      - http:
          path: championships/{championshipId}/contenders
          method: get
          cors: *corsConfig
      - http:
          path: admin/contenders/recalculate
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer

  # Images
  generateUploadUrl:
    handler: functions/images/generateUploadUrl.handler
    events:
      - http:
          path: images/upload-url
          method: post
          cors: *corsConfig
          authorizer: adminAuthorizer

  # API Documentation (Swagger UI + OpenAPI spec)
  serveSwaggerUi:
    handler: functions/docs/serveDocs.handler
    events:
      - http:
          path: api-docs
          method: get
          cors: *corsConfig

  serveOpenApiSpec:
    handler: functions/docs/serveDocs.handler
    events:
      - http:
          path: api-docs/spec
          method: get
          cors: *corsConfig

  # Statistics
  getStatistics:
    handler: functions/statistics/getStatistics.handler
    timeout: 29
    events:
      - http:
          path: statistics
          method: get
          cors: *corsConfig

  getRivalries:
    handler: functions/rivalries/getRivalries.handler
    timeout: 15
    events:
      - http:
          path: rivalries
          method: get
          cors: *corsConfig

resources:
  Resources:
    # API Gateway Response for CORS with Authorizer
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${self:custom.allowedOrigin.${self:provider.stage}, 'https://universe.jpdxsolo.com'}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: DEFAULT_4XX
        RestApiId:
          Ref: ApiGatewayRestApi

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${self:custom.allowedOrigin.${self:provider.stage}, 'https://universe.jpdxsolo.com'}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: DEFAULT_5XX
        RestApiId:
          Ref: ApiGatewayRestApi

    GatewayResponseUnauthorized:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${self:custom.allowedOrigin.${self:provider.stage}, 'https://universe.jpdxsolo.com'}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: UNAUTHORIZED
        RestApiId:
          Ref: ApiGatewayRestApi

    GatewayResponseAccessDenied:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'${self:custom.allowedOrigin.${self:provider.stage}, 'https://universe.jpdxsolo.com'}'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
          gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,DELETE,OPTIONS'"
        ResponseType: ACCESS_DENIED
        RestApiId:
          Ref: ApiGatewayRestApi

    WrestlersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.WRESTLERS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: wrestlerId
            AttributeType: S
          - AttributeName: companyId
            AttributeType: S
        KeySchema:
          - AttributeName: wrestlerId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CompanyIndex
            KeySchema:
              - AttributeName: companyId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    MatchesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.MATCHES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: matchId
            AttributeType: S
          - AttributeName: date
            AttributeType: S
          - AttributeName: tournamentId
            AttributeType: S
        KeySchema:
          - AttributeName: matchId
            KeyType: HASH
          - AttributeName: date
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: TournamentIndex
            KeySchema:
              - AttributeName: tournamentId
                KeyType: HASH
              - AttributeName: matchId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ChampionshipsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CHAMPIONSHIPS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: championshipId
            AttributeType: S
        KeySchema:
          - AttributeName: championshipId
            KeyType: HASH

    ChampionshipHistoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CHAMPIONSHIP_HISTORY_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: championshipId
            AttributeType: S
          - AttributeName: wonDate
            AttributeType: S
        KeySchema:
          - AttributeName: championshipId
            KeyType: HASH
          - AttributeName: wonDate
            KeyType: RANGE

    TournamentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TOURNAMENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: tournamentId
            AttributeType: S
        KeySchema:
          - AttributeName: tournamentId
            KeyType: HASH

    SeasonsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SEASONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: seasonId
            AttributeType: S
        KeySchema:
          - AttributeName: seasonId
            KeyType: HASH

    SeasonStandingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SEASON_STANDINGS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: seasonId
            AttributeType: S
          - AttributeName: wrestlerId
            AttributeType: S
        KeySchema:
          - AttributeName: seasonId
            KeyType: HASH
          - AttributeName: wrestlerId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: WrestlerIndex
            KeySchema:
              - AttributeName: wrestlerId
                KeyType: HASH
              - AttributeName: seasonId
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    DivisionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DIVISIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: divisionId
            AttributeType: S
        KeySchema:
          - AttributeName: divisionId
            KeyType: HASH

    EventsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.EVENTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: eventId
            AttributeType: S
          - AttributeName: eventType
            AttributeType: S
          - AttributeName: date
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: seasonId
            AttributeType: S
        KeySchema:
          - AttributeName: eventId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: DateIndex
            KeySchema:
              - AttributeName: eventType
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: SeasonIndex
            KeySchema:
              - AttributeName: seasonId
                KeyType: HASH
              - AttributeName: date
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    ContenderRankingsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.CONTENDER_RANKINGS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: championshipId
            AttributeType: S
          - AttributeName: wrestlerId
            AttributeType: S
          - AttributeName: rank
            AttributeType: N
        KeySchema:
          - AttributeName: championshipId
            KeyType: HASH
          - AttributeName: wrestlerId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: RankIndex
            KeySchema:
              - AttributeName: championshipId
                KeyType: HASH
              - AttributeName: rank
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    RankingHistoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.RANKING_HISTORY_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: wrestlerId
            AttributeType: S
          - AttributeName: weekKey
            AttributeType: S
          - AttributeName: championshipId
            AttributeType: S
        KeySchema:
          - AttributeName: wrestlerId
            KeyType: HASH
          - AttributeName: weekKey
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: ChampionshipWeekIndex
            KeySchema:
              - AttributeName: championshipId
                KeyType: HASH
              - AttributeName: weekKey
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    SiteConfigTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SITE_CONFIG_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: configKey
            AttributeType: S
        KeySchema:
          - AttributeName: configKey
            KeyType: HASH

    StipulationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.STIPULATIONS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: stipulationId
            AttributeType: S
        KeySchema:
          - AttributeName: stipulationId
            KeyType: HASH

    MatchTypesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.MATCH_TYPES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: matchTypeId
            AttributeType: S
        KeySchema:
          - AttributeName: matchTypeId
            KeyType: HASH

    SeasonAwardsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SEASON_AWARDS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: seasonId
            AttributeType: S
          - AttributeName: awardId
            AttributeType: S
        KeySchema:
          - AttributeName: seasonId
            KeyType: HASH
          - AttributeName: awardId
            KeyType: RANGE

    CompaniesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.COMPANIES_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: companyId
            AttributeType: S
        KeySchema:
          - AttributeName: companyId
            KeyType: HASH

    ShowsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.SHOWS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: showId
            AttributeType: S
          - AttributeName: companyId
            AttributeType: S
        KeySchema:
          - AttributeName: showId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: CompanyShowsIndex
            KeySchema:
              - AttributeName: companyId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    DraftsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DRAFTS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: draftId
            AttributeType: S
        KeySchema:
          - AttributeName: draftId
            KeyType: HASH

    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.IMAGES_BUCKET}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
              AllowedOrigins:
                - '*'
              MaxAge: 3000

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: '*'
              Action:
                - s3:GetObject
              Resource:
                - !Sub '${ImagesBucket.Arn}/*'

    # CloudFront Distribution for HTTPS frontend
    # Uses S3 website endpoint (existing public bucket) instead of OAI
    FrontendCloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: CloudFront distribution for ${self:custom.frontendDomain.${self:provider.stage}, 'universe.jpdxsolo.com'}
          DefaultRootObject: index.html
          Aliases:
            - ${self:custom.frontendDomain.${self:provider.stage}, 'universe.jpdxsolo.com'}
          Origins:
            - Id: S3WebsiteOrigin
              DomainName: ${self:custom.frontendBucket.${self:provider.stage}, 'universe.jpdxsolo.com'}.s3-website-us-east-1.amazonaws.com
              CustomOriginConfig:
                HTTPPort: 80
                HTTPSPort: 443
                OriginProtocolPolicy: http-only
          DefaultCacheBehavior:
            TargetOriginId: S3WebsiteOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            DefaultTTL: 86400
            MaxTTL: 31536000
            MinTTL: 0
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 0
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.certificateArn.${self:provider.stage}}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          HttpVersion: http2
          PriceClass: PriceClass_100

  Outputs:
    CloudFrontDistributionId:
      Description: CloudFront Distribution ID for cache invalidation
      Value: !Ref FrontendCloudFrontDistribution
      Export:
        Name: ${self:service}-${self:provider.stage}-CloudFrontDistributionId
    CloudFrontDomainName:
      Description: CloudFront Distribution Domain Name
      Value: !GetAtt FrontendCloudFrontDistribution.DomainName
      Export:
        Name: ${self:service}-${self:provider.stage}-CloudFrontDomainName
