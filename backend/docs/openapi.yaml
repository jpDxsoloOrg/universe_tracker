openapi: 3.0.3
info:
  title: WWE 2K League API
  version: 1.0.0
  description: Serverless API for managing a WWE 2K league (standings, championships, matches, tournaments, events, statistics). Authenticated endpoints require a JWT Bearer token (AWS Cognito).
  license:
    name: Unlicense
    url: https://unlicense.org

# Default: no auth required. Override with security: [{ BearerAuth: [] }] on protected operations.
security: []

servers:
  - url: http://localhost:3001/dev
    description: Local (serverless-offline)
  - url: <TBD after first deploy>
    description: Universe Tracker (dev)

tags:
  - name: Auth
  - name: Site Config
  - name: Wrestlers
  - name: Matches
  - name: Championships
  - name: Tournaments
  - name: Standings
  - name: Seasons
  - name: Divisions
  - name: Stipulations
  - name: Match Types
  - name: Events
  - name: Contenders
  - name: Images
  - name: Admin
  - name: Statistics

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT from AWS Cognito (login or admin).

  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Wrestler:
      type: object
      properties:
        wrestlerId: { type: string }
        userId: { type: string }
        name: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        imageUrl: { type: string }
        divisionId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Match:
      type: object
      properties:
        matchId: { type: string }
        date: { type: string }
        matchFormat: { type: string }
        stipulationId: { type: string }
        participants: { type: array, items: { type: string } }
        teams: { type: array, items: { type: array, items: { type: string } } }
        winners: { type: array, items: { type: string } }
        losers: { type: array, items: { type: string } }
        winningTeam: { type: integer }
        isChampionship: { type: boolean }
        isTitleDefense: { type: boolean }
        championshipId: { type: string }
        tournamentId: { type: string }
        seasonId: { type: string }
        status: { type: string, enum: [scheduled, completed] }
        createdAt: { type: string }
        challengeId: { type: string }
        promoId: { type: string }

    ScheduleMatchInput:
      type: object
      required: [matchFormat, participants, isChampionship, status]
      properties:
        date: { type: string }
        matchFormat: { type: string }
        stipulationId: { type: string }
        participants: { type: array, items: { type: string } }
        teams: { type: array, items: { type: array, items: { type: string } } }
        isChampionship: { type: boolean }
        championshipId: { type: string }
        tournamentId: { type: string }
        seasonId: { type: string }
        eventId: { type: string }
        designation: { type: string }
        status: { type: string, enum: [scheduled] }
        challengeId: { type: string }
        promoId: { type: string }

    RecordResultInput:
      type: object
      properties:
        winners: { type: array, items: { type: string } }
        losers: { type: array, items: { type: string } }
        winningTeam: { type: integer }

    Championship:
      type: object
      properties:
        championshipId: { type: string }
        name: { type: string }
        type: { type: string, enum: [singles, tag] }
        currentChampion: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        divisionId: { type: string }
        imageUrl: { type: string }
        createdAt: { type: string }
        isActive: { type: boolean }

    ChampionshipReign:
      type: object
      properties:
        championshipId: { type: string }
        champion: { oneOf: [{ type: string }, { type: array, items: { type: string } }] }
        wonDate: { type: string }
        lostDate: { type: string }
        matchId: { type: string }
        daysHeld: { type: integer }
        defenses: { type: integer }

    Tournament:
      type: object
      properties:
        tournamentId: { type: string }
        name: { type: string }
        type: { type: string, enum: [single-elimination, round-robin] }
        status: { type: string, enum: [upcoming, in-progress, completed] }
        participants: { type: array, items: { type: string } }
        brackets: { $ref: '#/components/schemas/TournamentBracket' }
        standings: { type: object }
        winner: { type: string }
        createdAt: { type: string }

    TournamentBracket:
      type: object
      properties:
        rounds: { type: array, items: { $ref: '#/components/schemas/BracketRound' } }

    BracketRound:
      type: object
      properties:
        roundNumber: { type: integer }
        matches: { type: array, items: { $ref: '#/components/schemas/BracketMatch' } }

    BracketMatch:
      type: object
      properties:
        matchId: { type: string }
        participant1: { type: string }
        participant2: { type: string }
        winner: { type: string }

    RoundRobinStanding:
      type: object
      properties:
        wrestlerId: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        points: { type: integer }

    Standings:
      type: object
      properties:
        wrestlers: { type: array, items: { $ref: '#/components/schemas/Wrestler' } }
        seasonId: { type: string }
        sortedByWins: { type: boolean }

    Season:
      type: object
      properties:
        seasonId: { type: string }
        name: { type: string }
        startDate: { type: string }
        endDate: { type: string }
        status: { type: string, enum: [active, completed] }
        createdAt: { type: string }
        updatedAt: { type: string }

    Division:
      type: object
      properties:
        divisionId: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    Stipulation:
      type: object
      properties:
        stipulationId: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    MatchType:
      type: object
      properties:
        matchTypeId: { type: string }
        name: { type: string }
        description: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }

    LeagueEvent:
      type: object
      properties:
        eventId: { type: string }
        name: { type: string }
        eventType: { type: string, enum: [ppv, weekly, special, house] }
        date: { type: string }
        venue: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        themeColor: { type: string }
        status: { type: string, enum: [upcoming, in-progress, completed, cancelled] }
        seasonId: { type: string }
        matchCards: { type: array, items: { $ref: '#/components/schemas/MatchCardEntry' } }
        attendance: { type: integer }
        rating: { type: number }
        fantasyEnabled: { type: boolean }
        fantasyLocked: { type: boolean }
        fantasyBudget: { type: integer }
        fantasyPicksPerDivision: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }

    MatchCardEntry:
      type: object
      properties:
        position: { type: integer }
        matchId: { type: string }
        designation: { type: string, enum: [pre-show, opener, midcard, co-main, main-event] }
        notes: { type: string }

    EventWithMatches:
      allOf:
        - { $ref: '#/components/schemas/LeagueEvent' }
        - type: object
          properties:
            enrichedMatches: { type: array }

    CreateEventInput:
      type: object
      required: [name, eventType, date]
      properties:
        name: { type: string }
        eventType: { type: string, enum: [ppv, weekly, special, house] }
        date: { type: string }
        venue: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        themeColor: { type: string }
        seasonId: { type: string }
        fantasyEnabled: { type: boolean }
        fantasyBudget: { type: integer }
        fantasyPicksPerDivision: { type: integer }

    UpdateEventInput:
      type: object
      properties:
        eventId: { type: string }
        name: { type: string }
        eventType: { type: string }
        date: { type: string }
        status: { type: string }
        matchCards: { type: array, items: { $ref: '#/components/schemas/MatchCardEntry' } }
        attendance: { type: integer }
        rating: { type: number }
        fantasyEnabled: { type: boolean }
        fantasyLocked: { type: boolean }
        fantasyBudget: { type: integer }
        fantasyPicksPerDivision: { type: integer }

    ChampionshipContenders:
      type: object
      properties:
        championshipId: { type: string }
        championshipName: { type: string }
        currentChampion: { type: object }
        contenders: { type: array }
        calculatedAt: { type: string }

    SiteFeatures:
      type: object
      properties:
        contenders: { type: boolean }
        statistics: { type: boolean }

    SiteConfigResponse:
      type: object
      properties:
        features: { $ref: '#/components/schemas/SiteFeatures' }

    AuthSetupInput:
      type: object
      properties:
        adminSetupKey: { type: string }
        email: { type: string }
        password: { type: string }
        username: { type: string }

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      properties:
        accessToken: { type: string, description: 'JWT access token for API authorization' }
        idToken: { type: string, description: 'JWT ID token with user claims' }
        refreshToken: { type: string, description: 'Token to refresh the session' }
        expiresIn: { type: integer, description: 'Token lifetime in seconds' }
        tokenType: { type: string, example: 'Bearer' }

    GenerateUploadUrlResponse:
      type: object
      properties:
        uploadUrl: { type: string }
        imageUrl: { type: string }

    WrestlerStatistics:
      type: object
      properties:
        wrestlerId: { type: string }
        statType: { type: string }
        wins: { type: integer }
        losses: { type: integer }
        draws: { type: integer }
        matchesPlayed: { type: integer }
        winPercentage: { type: number }
        currentWinStreak: { type: integer }
        longestWinStreak: { type: integer }
        championshipWins: { type: integer }
        championshipLosses: { type: integer }
        updatedAt: { type: string }

    HeadToHead:
      type: object
      properties:
        matchupKey: { type: string }
        wrestler1Id: { type: string }
        wrestler2Id: { type: string }
        wrestler1Wins: { type: integer }
        wrestler2Wins: { type: integer }
        draws: { type: integer }
        totalMatches: { type: integer }
        recentResults: { type: array }
        updatedAt: { type: string }

    LeaderboardEntry:
      type: object
      properties:
        wrestlerId: { type: string }
        wrestlerName: { type: string }
        wrestlerName: { type: string }
        value: { type: number }
        rank: { type: integer }

    RecordEntry:
      type: object
      properties:
        recordName: { type: string }
        holderName: { type: string }
        wrestlerName: { type: string }
        value: { oneOf: [{ type: number }, { type: string }] }
        date: { type: string }
        description: { type: string }

    Achievement:
      type: object
      properties:
        wrestlerId: { type: string }
        achievementId: { type: string }
        achievementName: { type: string }
        achievementType: { type: string }
        description: { type: string }
        earnedAt: { type: string }
        icon: { type: string }

    StatisticsResponse:
      type: object
      description: Response shape varies by query param section (overall, headToHead, leaderboards, records, achievements, etc.)
      additionalProperties: true

paths:
  /auth/setup:
    post:
      tags: [Auth]
      summary: Create initial admin user
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSetupInput' }
      responses:
        '201': { description: Admin created }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with username and password
      description: Authenticates against AWS Cognito and returns JWT tokens. Use the accessToken in the Authorization header as "Bearer {accessToken}" to call protected endpoints.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginInput' }
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Invalid credentials', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /site-config:
    get:
      tags: [Site Config]
      summary: Get site config (feature flags)
      responses:
        '200': { description: Site config }
        '500': { description: 'Server error', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /admin/site-config:
    put:
      tags: [Site Config]
      summary: Update site config
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SiteConfigResponse' }
      responses:
        '200': { description: Updated }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wrestlers/me:
    get:
      tags: [Profile]
      summary: Get my profile
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Current user wrestler profile }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      tags: [Profile]
      summary: Update my profile
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Wrestler' }
      responses:
        '200': { description: Updated }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wrestlers:
    get:
      tags: [Wrestlers]
      summary: List wrestlers
      responses:
        '200': { description: List of wrestlers }
    post:
      tags: [Wrestlers]
      summary: Create wrestler
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Wrestler' }
      responses:
        '201': { description: Created }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /wrestlers/{wrestlerId}:
    put:
      tags: [Wrestlers]
      summary: Update wrestler
      security: [{ BearerAuth: [] }]
      parameters:
        - name: wrestlerId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Wrestler' }
      responses:
        '200': { description: Updated }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Wrestlers]
      summary: Delete wrestler
      security: [{ BearerAuth: [] }]
      parameters:
        - name: wrestlerId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /matches:
    get:
      tags: [Matches]
      summary: List matches
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, completed] }
      responses:
        '200': { description: List of matches }
    post:
      tags: [Matches]
      summary: Schedule match
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleMatchInput' }
      responses:
        '201': { description: Match scheduled }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /matches/{matchId}/result:
    put:
      tags: [Matches]
      summary: Record match result
      security: [{ BearerAuth: [] }]
      parameters:
        - name: matchId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordResultInput' }
      responses:
        '200': { description: Result recorded }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /championships:
    get:
      tags: [Championships]
      summary: List championships
      responses:
        '200': { description: List of championships }
    post:
      tags: [Championships]
      summary: Create championship
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Championship' }
      responses:
        '201': { description: Created }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /championships/{championshipId}/history:
    get:
      tags: [Championships]
      summary: Get championship history
      parameters:
        - name: championshipId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reign history }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /championships/{championshipId}/contenders:
    get:
      tags: [Contenders]
      summary: Get contender rankings for championship
      parameters:
        - name: championshipId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Contenders }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /championships/{championshipId}:
    put:
      tags: [Championships]
      summary: Update championship
      security: [{ BearerAuth: [] }]
      parameters:
        - name: championshipId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Championship' }
      responses:
        '200': { description: Updated }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    delete:
      tags: [Championships]
      summary: Delete championship
      security: [{ BearerAuth: [] }]
      parameters:
        - name: championshipId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /championships/{championshipId}/vacate:
    post:
      tags: [Championships]
      summary: Vacate championship
      security: [{ BearerAuth: [] }]
      parameters:
        - name: championshipId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Vacated }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /tournaments:
    get:
      tags: [Tournaments]
      summary: List tournaments
      responses:
        '200': { description: List of tournaments }
    post:
      tags: [Tournaments]
      summary: Create tournament
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tournament' }
      responses:
        '201': { description: Created }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /tournaments/{tournamentId}:
    put:
      tags: [Tournaments]
      summary: Update tournament
      security: [{ BearerAuth: [] }]
      parameters:
        - name: tournamentId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tournament' }
      responses:
        '200': { description: Updated }
        '401': { description: 'Unauthorized', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: 'Forbidden', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { description: 'Not found', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  /standings:
    get:
      tags: [Standings]
      summary: Get standings
      parameters:
        - name: seasonId
          in: query
          schema: { type: string }
      responses:
        '200': { description: Standings }

  /seasons:
    get:
      tags: [Seasons]
      summary: List seasons
      responses:
        '200': { description: List of seasons }
    post:
      tags: [Seasons]
      summary: Create season
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Season' }
      responses:
        '201': { description: Created }
        '400': { description: 'Bad request', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
